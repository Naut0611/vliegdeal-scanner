name: Nachtelijke scan

on:
  schedule:
    # 5:38 UTC = 7:38 lokale tijd nu (zomertijd/CEST); in wintertijd (CET) wordt dit
    # lokaal 6:38. LET OP: deze schedule-trigger is bij herhaling niet blijken af te
    # gaan (3 losse pogingen, op 3 verschillende tijden, ook na een handmatige
    # uit/aanzet-cyclus van de workflow -- zie CLAUDE.md/gesprekshistorie). De
    # daadwerkelijke, betrouwbare nachtelijke run blijft dus vooralsnog lokale
    # launchd (scripts/run_daily.sh); deze GitHub-schedule is een bonus die het tot
    # nu toe niet doet, geen vervanging. `workflow_dispatch` (handmatig of via een
    # externe cron-aanroep op de GitHub API) werkt wel betrouwbaar.
    - cron: "38 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scan
        run: python scanner.py

      # Draait ook als de scan hierboven faalt/afbreekt (if: always()), zodat de
      # private repo's pipeline (livecheck/curate/recheck/review/kalender) net als
      # bij een lokale run gewoon doorgaat op wat er al ligt.
      - name: Meld de private repo dat de scan klaar is
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          SCAN_OUTCOME: ${{ job.status }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Naut0611/vliegdealtjes/dispatches" \
            -d "{\"event_type\":\"scan-klaar\",\"client_payload\":{\"status\":\"${SCAN_OUTCOME}\"}}"
