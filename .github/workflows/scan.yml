name: Nachtelijke scan

on:
  schedule:
    # 5:38 UTC = 7:38 lokale tijd nu (zomertijd/CEST); in wintertijd (CET) wordt dit
    # lokaal 6:38 -- cron kent geen tijdzones/DST. Bewust niet op een rond heel uur:
    # GitHub's schedule-runs zijn dan het vaakst vertraagd/overgeslagen bij drukte.
    # Twee losse testpogingen (met resp. ~2 min en ~20 min marge na het pushen van
    # een schema-wijziging) vuurden geen van beide af -- opgelost door de workflow
    # eenmalig handmatig uit/aan te zetten in de GitHub-UI, waarna GitHub de
    # schedule opnieuw registreert. Niet meer snel achter elkaar wijzigen: laat 'm
    # met rust zodat hij kan settelen.
    - cron: "38 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scan
        run: python scanner.py

      # Draait ook als de scan hierboven faalt/afbreekt (if: always()), zodat de
      # private repo's pipeline (livecheck/curate/recheck/review/kalender) net als
      # bij een lokale run gewoon doorgaat op wat er al ligt.
      - name: Meld de private repo dat de scan klaar is
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          SCAN_OUTCOME: ${{ job.status }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Naut0611/vliegdealtjes/dispatches" \
            -d "{\"event_type\":\"scan-klaar\",\"client_payload\":{\"status\":\"${SCAN_OUTCOME}\"}}"
