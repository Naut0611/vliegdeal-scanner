name: Nachtelijke scan

on:
  schedule:
    # Terug naar 5:38 UTC (07:38 CEST) na uitgebreid troubleshooten van GitHub's
    # schedule-trigger op deze workflow: geteste tijden met ruime marge (~1,5u),
    # krappe marge (~3 min) en een elke-minuut-cron (9+ kansen) leverden allemaal
    # `event=schedule` total_count: 0 op -- geen enkele scheduled run, ooit. Repo-
    # permissies zijn bevestigd correct (Settings > Actions, en via GitHub Copilot).
    # workflow_dispatch werkt intussen wel 100% betrouwbaar. Conclusie: dit is geen
    # config-/timingprobleem aan onze kant maar iets structureels bij GitHub voor
    # deze repo/workflow -- vervolgstap is GitHub Support of een externe cron-dienst
    # die workflow_dispatch aanroept, niet verder testen met crontijden.
    - cron: "38 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scan
        run: python scanner.py

      # Draait ook als de scan hierboven faalt/afbreekt (if: always()), zodat de
      # private repo's pipeline (livecheck/curate/recheck/review/kalender) net als
      # bij een lokale run gewoon doorgaat op wat er al ligt.
      - name: Meld de private repo dat de scan klaar is
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          SCAN_OUTCOME: ${{ job.status }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Naut0611/vliegdealtjes/dispatches" \
            -d "{\"event_type\":\"scan-klaar\",\"client_payload\":{\"status\":\"${SCAN_OUTCOME}\"}}"
