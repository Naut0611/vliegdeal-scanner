name: Nachtelijke scan

# GEEN schedule: hier -- uitgebreid getest (ruime marge, krappe marge, een elke-minuut-cron: 9+
# kansen) en `event=schedule` gaf keer op keer `total_count: 0`. GitHub's scheduler heeft deze
# workflow nooit ook maar geprobeerd te starten, terwijl workflow_dispatch hieronder wel 100%
# betrouwbaar werkt. Root cause onbekend/aan GitHub's kant, niet verder onderzocht na dit bewijs.
# Wordt daarom dagelijks aangeroepen door een externe cron-dienst (buiten GitHub) die op tijd een
# POST doet naar deze workflow's /dispatches-endpoint met een GitHub Personal Access Token -- zie
# CLAUDE.md in de private repo voor de volledige toelichting/opzet.
#
# Meerdere RONDES per nacht: GitHub breekt elke job na 6 uur af, dus meer scans per nacht betekent
# meerdere jobs achter elkaar (nooit tegelijk: de concurrency-groep hieronder laat een volgende
# ronde wachten tot de vorige klaar is -- scraping-etiquette). Elke ronde stopt zelf netjes na
# --max-minuten (ruim onder de 6 uur) en start daarna de volgende; elke ronde kiest via de planner
# de meest achterstallige combinaties uit de database, dus de rondes overlappen niet. Pas de LAATSTE
# ronde meldt de private repo dat de scan klaar is. De externe cron hoeft alleen ronde 1 te starten
# (defaults hieronder) -- de eerste ronde is dus precies wat de cron al deed.
on:
  workflow_dispatch:
    inputs:
      ronde:
        description: "Huidige ronde (de externe cron laat dit leeg = 1)"
        default: "1"
      rondes:
        description: "Totaal aantal rondes deze nacht"
        default: "3"

permissions:
  actions: write  # nodig om de volgende ronde met GITHUB_TOKEN te starten

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scan (ronde ${{ inputs.ronde }} van ${{ inputs.rondes }})
        run: python scanner.py --max-minuten 180

      # Draait ook als de scan hierboven faalt/afbreekt (if: always()), zodat de keten nooit
      # halverwege stilvalt en de private repo's pipeline (livecheck/curate/recheck/review/kalender)
      # altijd uiteindelijk draait op wat er al ligt.
      - name: Start de volgende ronde
        if: always() && fromJSON(inputs.ronde) < fromJSON(inputs.rondes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scan.yml --repo "${{ github.repository }}" \
            -f ronde=$(( ${{ inputs.ronde }} + 1 )) -f rondes=${{ inputs.rondes }}

      # De laatste ronde start de rest van de dagelijkse keten (dagelijks.yml: livecheck, curate,
      # recheck, review, kalender), die ook hier draait wegens de Actions-minuten van de private repo.
      - name: Start de dealcontrole
        if: always() && fromJSON(inputs.ronde) >= fromJSON(inputs.rondes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dagelijks.yml --repo "${{ github.repository }}" --ref main
